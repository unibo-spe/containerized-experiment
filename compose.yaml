services:
  experiment-dt:
    build: &experiment_build
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.14"
    volumes: &volumes
      - ./data:/data
    # run as the host user, so that results in ./data are owned by them (cf. README)
    user: &user "${HOST_UID:-1000}:${HOST_GID:-1000}"
    hostname: dt
    environment:
      MODEL_DecisionTree: |
          sklearn.tree.DecisionTreeClassifier: 
              max_depth: [null, 10, 20]
              min_samples_split: [2, 10, 20]

  experiment-mlp:
    build: *experiment_build
    volumes: *volumes
    user: *user
    hostname: mlp
    environment:
      MODEL_MLP: |
          sklearn.neural_network.MLPClassifier: 
              hidden_layer_sizes: 
                - [50]
                - [100,]
                - [50, 50]
              activation: ['tanh', 'relu']
              solver: ['adam', 'sgd']

  experiment-lr:
    build: *experiment_build
    volumes: *volumes
    user: *user
    hostname: lr
    environment:
      MODEL_LogisticRegression: |
          sklearn.linear_model.LogisticRegression: 
              C: [0.1, 1, 10]
              solver: ['liblinear', 'lbfgs']

  experiment-svm:
    build: *experiment_build
    volumes: *volumes
    user: *user
    hostname: svm
    environment:
      MODEL_SVM: |
          sklearn.svm.SVC: 
              C: [0.1, 1, 10]
              kernel: ['linear', 'rbf']
